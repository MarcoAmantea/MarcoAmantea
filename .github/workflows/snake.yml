name: Update contribution snake

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-snake
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MarcoAmantea
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%230E79F2
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%233CF2B5

      - name: Copy animations to output folder
        run: |
          mkdir -p output
          cp dist/github-contribution-grid-snake.svg output/
          cp dist/github-contribution-grid-snake-dark.svg output/

      - name: Commit changes only when necessary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/github-contribution-grid-snake.svg output/github-contribution-grid-snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh contribution animation'
            git push
          else
            echo 'No changes to publish.'
          fi
