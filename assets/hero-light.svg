<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="title desc">
<title id="title">Marco Amantea — Web Developer &amp; UI/UX Designer</title>
<desc id="desc">Banner con tipografia premium, accenti blu e verde e una finestra di codice animata</desc>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFF6FF"/><stop offset=".65" stop-color="#DDEFFF"/><stop offset="1" stop-color="#E7FFF8"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#0867C7"/><stop offset="1" stop-color="#048766"/></linearGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M 38 0 L 0 0 0 38" fill="none" stroke="#DBE7F5" stroke-width="1"/></pattern>
  <radialGradient id="glow"><stop offset="0" stop-color="#0867C7" stop-opacity=".12"/><stop offset="1" stop-color="#0867C7" stop-opacity="0"/></radialGradient>
  <clipPath id="cardclip"><rect x="735" y="63" width="405" height="313" rx="18"/></clipPath>
  <style>
    .dot {animation: pulse 2.8s ease-in-out infinite;transform-origin:center;}
    .cursor {animation: blink 1.1s steps(1) infinite;}
    .shine {animation: shimmer 5s ease-in-out infinite;}
    @keyframes pulse {0%,100%{opacity:1}50%{opacity:.32}}
    @keyframes blink {0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes shimmer {0%,100%{opacity:.60}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.dot,.cursor,.shine{animation:none}}
  </style>
</defs>
<rect width="1200" height="440" rx="18" fill="url(#base)"/>
<rect width="1200" height="440" rx="18" fill="url(#grid)" opacity=".85"/>
<circle cx="1084" cy="80" r="280" fill="url(#glow)"/>
<path d="M0 0 H1200 V440 H0Z" fill="none" stroke="#D2E5F5" stroke-width="2"/>
<path d="M52 50 h35" stroke="#0867C7" stroke-width="5" stroke-linecap="round"/>
<text x="104" y="56" fill="#485F78" font-family="'DejaVu Sans Mono',monospace" font-size="15" letter-spacing="2">HELLO, WORLD / I'M</text>
<text x="56" y="162" fill="#0C1931" font-family="Inter,Arial,sans-serif" font-size="87" font-weight="800" letter-spacing="-4">MARCO</text>
<text x="55" y="250" fill="url(#accent)" font-family="Inter,Arial,sans-serif" font-size="87" font-weight="800" letter-spacing="-4">AMANTEA<tspan fill="#0C1931">.</tspan></text>
<text x="59" y="302" fill="#485F78" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="500">Web Developer <tspan fill="#0867C7">/</tspan> Web Designer <tspan fill="#048766">/</tspan> UI/UX</text>
<rect x="58" y="338" width="216" height="43" rx="21" fill="#FFFFFF" stroke="#C9DCEA"/>
<circle cx="79" cy="359" r="5" fill="#048766" class="dot"/>
<text x="96" y="365" font-size="14" font-family="'DejaVu Sans Mono',monospace" fill="#233C58">DESIGN → DEPLOY</text>
<text x="291" y="365" font-size="14" font-family="'DejaVu Sans Mono',monospace" fill="#54728E">BUILDING THE WEB, DIFFERENTLY.</text>
<rect x="735" y="63" width="405" height="313" rx="18" fill="#FFFFFF" stroke="#C9DCEA" stroke-width="2"/>
<g clip-path="url(#cardclip)">
  <rect x="735" y="63" width="405" height="48" fill="#DBE7F5" opacity=".7"/>
  <circle cx="758" cy="87" r="6" fill="#FE7076"/><circle cx="779" cy="87" r="6" fill="#F5BB66"/><circle cx="800" cy="87" r="6" fill="#42C995"/>
  <text x="846" y="92" font-family="'DejaVu Sans Mono',monospace" font-size="13" fill="#485F78">marco.amantea / profile.tsx</text>
  <path d="M767 135V340" stroke="#C9DCEA" stroke-width="1"/>
  <g font-family="'DejaVu Sans Mono',monospace" font-size="15" fill="#54728E" text-anchor="end">
     <text x="757" y="158">01</text><text x="757" y="193">02</text><text x="757" y="228">03</text><text x="757" y="263">04</text><text x="757" y="298">05</text><text x="757" y="333">06</text>
  </g>
  <g font-family="'DejaVu Sans Mono',monospace" font-size="15" fill="#233C58">
  <text x="781" y="158"><tspan fill="#0867C7">const</tspan> creator = <tspan fill="#048766">&#123;</tspan></text>
  <text x="798" y="193">name: <tspan fill="#048766">'Marco Amantea'</tspan>,</text>
  <text x="798" y="228">focus: <tspan fill="#048766">'Design + Code'</tspan>,</text>
  <text x="798" y="263">stack: [<tspan fill="#0867C7">'React'</tspan>, <tspan fill="#0867C7">'TS'</tspan>],</text>
  <text x="798" y="298">mission: <tspan fill="#048766">'Make it matter'</tspan></text>
  <text x="781" y="333" fill="#048766">&#125;;<tspan class="cursor" fill="#0867C7">▍</tspan></text>
  </g>
</g>
<path d="M739 392 H1139" stroke="#D2E5F5"/>
<circle cx="751" cy="412" r="4" fill="#048766" class="dot"/><text x="766" y="417" font-size="12" fill="#54728E" font-family="'DejaVu Sans Mono',monospace">CRAFTING MEANINGFUL EXPERIENCES</text>
<rect x="0" y="432" width="1200" height="8" fill="url(#accent)" class="shine"/>
</svg>